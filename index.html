<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospect Agenda</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f6f8;
  color:#111827;
}

header{
  background:linear-gradient(135deg,#111827,#2563eb);
  color:white;
  padding:25px 20px 30px;
  border-radius:0 0 28px 28px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:6px 0 0;
  opacity:.8;
}

main{
  padding:18px;
  padding-bottom:100px;
}

.card{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

h2{
  margin-top:0;
  font-size:20px;
}

label{
  display:block;
  font-weight:600;
  font-size:14px;
  margin:14px 0 7px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#f9fafb;
  font-size:16px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:13px;
  padding:13px 16px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  width:100%;
  background:#2563eb;
  color:white;
  margin-top:18px;
}

.secondary{
  background:#e5e7eb;
  color:#111827;
}

.green{
  background:#16a34a;
  color:white;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.prospect{
  background:white;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.prospect strong{
  font-size:18px;
}

.small{
  color:#6b7280;
  font-size:14px;
  margin-top:5px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions button{
  flex:1;
  font-size:13px;
  padding:11px 7px;
}

.badge{
  display:inline-block;
  background:#dbeafe;
  color:#1d4ed8;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  margin-top:8px;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:space-around;
  padding:10px 5px calc(10px + env(safe-area-inset-bottom));
  z-index:100;
}

nav button{
  background:none;
  color:#6b7280;
  font-size:12px;
  padding:7px;
}

nav button.active{
  color:#2563eb;
}

.hidden{
  display:none;
}

.search{
  margin-bottom:15px;
}

.info{
  background:#eff6ff;
  color:#1e40af;
  padding:12px;
  border-radius:12px;
  font-size:14px;
  margin-bottom:15px;
}
</style>
</head>

<body>

<header>
  <h1>Prospect Agenda</h1>
  <p>Prospection & rendez-vous</p>
</header>

<main>

<section id="prospectsPage">

  <div class="card">
    <h2>Mes prospects</h2>
    <input class="search" id="search" placeholder="🔎 Rechercher un prospect..." oninput="displayProspects()">
    <div id="prospectsList"></div>
  </div>

</section>

<section id="agendaPage" class="hidden">

  <div class="card">
    <h2>📅 Mon agenda</h2>
    <div id="appointmentsList"></div>
  </div>

</section>

<section id="newPage" class="hidden">

  <div class="card">

    <h2>➕ Nouveau prospect</h2>

    <div class="info">
      👤 Rendez-vous pris par <strong>Romaric</strong><br>
      📅 La date de prise de rendez-vous est automatique.
    </div>

    <input type="hidden" id="datePrise">

    <label>Date de prise du rendez-vous</label>
    <input id="datePriseAffichage" disabled>

    <div class="grid">

      <div>
        <label>Prénom</label>
        <input id="firstName" placeholder="Prénom">
      </div>

      <div>
        <label>Nom</label>
        <input id="lastName" placeholder="Nom">
      </div>

    </div>

    <label>Téléphone</label>
    <input id="phone" type="tel" placeholder="06...">

    <label>Adresse</label>
    <input id="address" placeholder="Adresse complète">

    <label>Comment chauffez-vous votre logement ?</label>
    <input id="heating" placeholder="Gaz, fioul, électrique, bois...">

    <div class="grid">

      <div>
        <label>Facture gaz mensuelle</label>
        <input id="gasBill" placeholder="Ex : 120 €">
      </div>

      <div>
        <label>Facture électrique mensuelle</label>
        <input id="electricBill" placeholder="Ex : 90 €">
      </div>

    </div>

    <label>Type de production d’eau chaude</label>
    <input id="hotWater" placeholder="Ballon, chaudière...">

    <div class="grid">

      <div>
        <label>Surface du logement</label>
        <input id="surface" type="number" placeholder="Ex : 100">
      </div>

      <div>
        <label>Nombre d’occupants</label>
        <input id="occupants" type="number" placeholder="Ex : 4">
      </div>

    </div>

    <label>Âge / état de l’équipement actuel</label>
    <input id="equipment" placeholder="Ex : chaudière 15 ans">

    <label>Projet envisagé</label>
    <input id="projet" placeholder="Pompe à chaleur, poêle, panneaux...">

    <label>Autres détails</label>
    <textarea id="details" placeholder="Informations complémentaires..."></textarea>

    <h2 style="margin-top:25px">📅 Rendez-vous</h2>

    <label>Date du rendez-vous</label>
    <input id="rdvDate" type="date">

    <label>Heure</label>
    <input id="rdvHeure" type="time" value="09:00">

    <label>Durée</label>
    <select id="duree">
      <option value="30">30 minutes</option>
      <option value="45">45 minutes</option>
      <option value="60" selected>1 heure</option>
      <option value="90">1h30</option>
      <option value="120">2 heures</option>
    </select>

    <button class="primary" onclick="saveProspect()">
      💾 Enregistrer le prospect
    </button>

    <button class="secondary" style="width:100%;margin-top:10px" onclick="clearForm()">
      Effacer
    </button>

  </div>

</section>

</main>

<nav>
  <button id="navProspects" class="active" onclick="showPage('prospects')">
    👥<br>Prospects
  </button>

  <button id="navAgenda" onclick="showPage('agenda')">
    📅<br>Agenda
  </button>

  <button id="navNew" onclick="showPage('new')">
    ➕<br>Nouveau
  </button>
</nav>

<script>

const PROSPECTS_KEY="prospects";
const APPOINTMENTS_KEY="appointments";

function getProspects(){
  return JSON.parse(localStorage.getItem(PROSPECTS_KEY)||"[]");
}

function getAppointments(){
  return JSON.parse(localStorage.getItem(APPOINTMENTS_KEY)||"[]");
}

function saveData(key,data){
  localStorage.setItem(key,JSON.stringify(data));
}

function getToday(){
  const d=new Date();
  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

function formatDateFR(date){
  if(!date)return"";
  const parts=date.split("-");
  return parts[2]+"/"+parts[1]+"/"+parts[0];
}

function initialiseDates(){

  const today=getToday();

  document.getElementById("datePrise").value=today;

  document.getElementById("datePriseAffichage").value=
    formatDateFR(today);

  if(!document.getElementById("rdvDate").value){
    document.getElementById("rdvDate").value=today;
  }

}

function showPage(page){

  document.getElementById("prospectsPage").classList.add("hidden");
  document.getElementById("agendaPage").classList.add("hidden");
  document.getElementById("newPage").classList.add("hidden");

  document.getElementById("navProspects").classList.remove("active");
  document.getElementById("navAgenda").classList.remove("active");
  document.getElementById("navNew").classList.remove("active");

  if(page==="prospects"){
    document.getElementById("prospectsPage").classList.remove("hidden");
    document.getElementById("navProspects").classList.add("active");
    displayProspects();
  }

  if(page==="agenda"){
    document.getElementById("agendaPage").classList.remove("hidden");
    document.getElementById("navAgenda").classList.add("active");
    displayAppointments();
  }

  if(page==="new"){
    document.getElementById("newPage").classList.remove("hidden");
    document.getElementById("navNew").classList.add("active");
    initialiseDates();
  }

}

function saveProspect(){

  const firstName=document.getElementById("firstName").value.trim();
  const lastName=document.getElementById("lastName").value.trim();

  if(!firstName && !lastName){
    alert("Veuillez renseigner au minimum le prénom ou le nom.");
    return;
  }

  const prospect={
    id:Date.now(),
    firstName:firstName,
    lastName:lastName,
    phone:document.getElementById("phone").value.trim(),
    address:document.getElementById("address").value.trim(),
    heating:document.getElementById("heating").value.trim(),
    gasBill:document.getElementById("gasBill").value.trim(),
    hotWater:document.getElementById("hotWater").value.trim(),
    surface:document.getElementById("surface").value.trim(),
    occupants:document.getElementById("occupants").value.trim(),
    electricBill:document.getElementById("electricBill").value.trim(),
    equipment:document.getElementById("equipment").value.trim(),
    projet:document.getElementById("projet").value.trim(),
    details:document.getElementById("details").value.trim(),
    prisPar:"Romaric",
    datePrise:document.getElementById("datePrise").value
  };

  const prospects=getProspects();
  prospects.push(prospect);
  saveData(PROSPECTS_KEY,prospects);

  const rdvDate=document.getElementById("rdvDate").value;
  const rdvHeure=document.getElementById("rdvHeure").value;
  const duree=document.getElementById("duree").value;

  if(rdvDate && rdvHeure){

    const appointment={
      id:Date.now(),
      prospectId:prospect.id,
      date:rdvDate,
      time:rdvHeure,
      duration:duree,
      firstName:firstName,
      lastName:lastName,
      address:prospect.address,
      phone:prospect.phone
    };

    const appointments=getAppointments();
    appointments.push(appointment);
    saveData(APPOINTMENTS_KEY,appointments);

    ouvrirGoogleAgenda(prospect,appointment);

  }else{
    alert("Prospect enregistré !");
  }

  clearForm();
  displayProspects();

}

function ouvrirGoogleAgenda(prospect,appointment){

  const start=convertirDateGoogle(
    appointment.date,
    appointment.time
  );

  const end=calculerFin(
    appointment.date,
    appointment.time,
    Number(appointment.duration)
  );

  const title=
    "RDV - "+
    prospect.firstName+" "+
    prospect.lastName;

  const description=
`Rendez-vous pris par : ${prospect.prisPar}
Date de prise : ${formatDateFR(prospect.datePrise)}

Téléphone : ${prospect.phone}
Adresse : ${prospect.address}

Chauffage : ${prospect.heating}
Facture gaz mensuelle : ${prospect.gasBill}
Production eau chaude : ${prospect.hotWater}
Surface : ${prospect.surface} m²
Nombre d'occupants : ${prospect.occupants}
Facture électrique : ${prospect.electricBill}
Âge / état équipement : ${prospect.equipment}

Projet envisagé : ${prospect.projet}

Autres détails :
${prospect.details}`;

  const url=
    "https://calendar.google.com/calendar/render?action=TEMPLATE"+
    "&text="+encodeURIComponent(title)+
    "&dates="+start+"/"+end+
    "&details="+encodeURIComponent(description)+
    "&location="+encodeURIComponent(prospect.address);

  window.open(url,"_blank");

}

function convertirDateGoogle(date,time){

  return date.replaceAll("-","")+
    "T"+
    time.replace(":","")+"00";

}

function calculerFin(date,time,duration){

  const d=new Date(date+"T"+time+":00");

  d.setMinutes(d.getMinutes()+duration);

  const year=d.getFullYear();
  const month=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  const hours=String(d.getHours()).padStart(2,"0");
  const minutes=String(d.getMinutes()).padStart(2,"0");

  return year+month+day+"T"+hours+minutes+"00";

}

function displayProspects(){

  const list=document.getElementById("prospectsList");

  const search=
    (document.getElementById("search")?.value||"")
    .toLowerCase();

  const prospects=getProspects().filter(p=>
    (p.firstName+" "+p.lastName+" "+
     p.phone+" "+p.address+" "+p.projet)
    .toLowerCase()
    .includes(search)
  );

  if(prospects.length===0){

    list.innerHTML=
      `<div class="small">
        Aucun prospect pour le moment.
      </div>`;

    return;
  }

  list.innerHTML=prospects.map(p=>`

    <div class="prospect">

      <strong>
        ${escapeHTML(p.firstName)} ${escapeHTML(p.lastName)}
      </strong>

      <div class="badge">
        Pris par ${escapeHTML(p.prisPar||"Romaric")}
      </div>

      <div class="small">
        📞 ${escapeHTML(p.phone||"Non renseigné")}
      </div>

      <div class="small">
        📍 ${escapeHTML(p.address||"Non renseignée")}
      </div>

      <div class="small">
        🔥 ${escapeHTML(p.heating||"Non renseigné")}
      </div>

      <div class="small">
        🏠 ${escapeHTML(p.projet||"Projet non renseigné")}
      </div>

      <div class="actions">

        <button class="green"
          onclick="callClient('${p.phone||""}')">
          📞 Appeler
        </button>

        <button class="secondary"
          onclick="openMaps('${p.address||""}')">
          📍 Itinéraire
        </button>

        <button class="primary"
          style="margin:0"
          onclick="nouveauRdv(${p.id})">
          📅 RDV
        </button>

      </div>

    </div>

  `).join("");

}

function displayAppointments(){

  const list=document.getElementById("appointmentsList");
  const appointments=getAppointments();

  if(appointments.length===0){

    list.innerHTML=
      `<div class="small">
        Aucun rendez-vous enregistré.
      </div>`;

    return;
  }

  appointments.sort((a,b)=>
    (a.date+a.time).localeCompare(b.date+b.time)
  );

  list.innerHTML=appointments.map(a=>`

    <div class="prospect">

      <strong>
        📅 ${escapeHTML(a.firstName)}
        ${escapeHTML(a.lastName)}
      </strong>

      <div class="badge">
        ${formatDateFR(a.date)} à ${a.time}
      </div>

      <div class="small">
        ⏱ ${a.duration} minutes
      </div>

      <div class="small">
        📞 ${escapeHTML(a.phone||"")}
      </div>

      <div class="small">
        📍 ${escapeHTML(a.address||"")}
      </div>

      <div class="actions">

        <button class="green"
          onclick="callClient('${a.phone||""}')">
          📞 Appeler
        </button>

        <button class="secondary"
          onclick="openMaps('${a.address||""}')">
          📍 Itinéraire
        </button>

      </div>

    </div>

  `).join("");

}

function nouveauRdv(id){

  const prospect=
    getProspects().find(p=>p.id===id);

  if(!prospect)return;

  showPage("new");

  document.getElementById("firstName").value=prospect.firstName||"";
  document.getElementById("lastName").value=prospect.lastName||"";
  document.getElementById("phone").value=prospect.phone||"";
  document.getElementById("address").value=prospect.address||"";
  document.getElementById("heating").value=prospect.heating||"";
  document.getElementById("gasBill").value=prospect.gasBill||"";
  document.getElementById("hotWater").value=prospect.hotWater||"";
  document.getElementById("surface").value=prospect.surface||"";
  document.getElementById("occupants").value=prospect.occupants||"";
  document.getElementById("electricBill").value=prospect.electricBill||"";
  document.getElementById("equipment").value=prospect.equipment||"";
  document.getElementById("projet").value=prospect.projet||"";
  document.getElementById("details").value=prospect.details||"";

  initialiseDates();

}

function callClient(phone){

  if(phone){
    window.location.href="tel:"+phone;
  }

}

function openMaps(address){

  if(address){
    window.open(
      "https://www.google.com/maps/search/?api=1&query="+
      encodeURIComponent(address),
      "_blank"
    );
  }

}

function clearForm(){

  document.getElementById("firstName").value="";
  document.getElementById("lastName").value="";
  document.getElementById("phone").value="";
  document.getElementById("address").value="";
  document.getElementById("heating").value="";
  document.getElementById("gasBill").value="";
  document.getElementById("hotWater").value="";
  document.getElementById("surface").value="";
  document.getElementById("occupants").value="";
  document.getElementById("electricBill").value="";
  document.getElementById("equipment").value="";
  document.getElementById("projet").value="";
  document.getElementById("details").value="";

  initialiseDates();

}

function escapeHTML(text){

  return String(text||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

initialiseDates();
displayProspects();

</script>

</body>
</html>
