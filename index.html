<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospect Agenda</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f7;
  color:#111;
}
header{
  background:#111;
  color:white;
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:700;
}
nav{
  display:flex;
  background:white;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:10;
}
nav button{
  flex:1;
  border:0;
  background:white;
  padding:14px 5px;
  font-size:14px;
}
nav button.active{
  font-weight:700;
  border-bottom:3px solid #111;
}
main{padding:15px;max-width:700px;margin:auto}
.section{display:none}
.section.active{display:block}
.card{
  background:white;
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #00000012;
}
input,select,textarea{
  width:100%;
  padding:13px;
  margin:6px 0 12px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  background:white;
}
textarea{min-height:100px;resize:vertical}
label{
  font-weight:600;
  display:block;
  margin-top:8px;
}
button.action{
  width:100%;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:600;
  margin-top:8px;
}
button.secondary{
  background:#eee;
  color:#111;
}
button.danger{
  background:#d93025;
}
.small{
  color:#666;
  font-size:13px;
}
.row{
  display:flex;
  gap:8px;
}
.row button{flex:1}
h2{margin-top:5px}
</style>
</head>

<body>

<header>Prospect Agenda</header>

<nav>
  <button class="tab active" onclick="showTab('prospects',this)">Prospects</button>
  <button class="tab" onclick="showTab('agenda',this)">Agenda</button>
  <button class="tab" onclick="showTab('new',this)">Nouveau</button>
</nav>

<main>

<!-- PROSPECTS -->
<section id="prospects" class="section active">
  <h2>Mes prospects</h2>

  <input
    id="search"
    type="search"
    placeholder="Rechercher nom, téléphone ou adresse..."
    oninput="renderProspects()"
  >

  <div id="prospectList"></div>
</section>


<!-- AGENDA -->
<section id="agenda" class="section">
  <h2>Mes rendez-vous</h2>
  <div id="agendaList"></div>
</section>


<!-- NOUVEAU -->
<section id="new" class="section">

<h2>Nouveau prospect</h2>

<div class="card">

<label>Prénom</label>
<input id="prenom" type="text">

<label>Nom</label>
<input id="nom" type="text">

<label>Téléphone</label>
<input id="telephone" type="tel">

<label>Adresse</label>
<input id="adresse" type="text">

<label>Comment chauffez-vous votre logement ?</label>
<input id="chauffage" type="text">

<label>Montant mensuel de la facture de gaz</label>
<input id="gaz" type="text">

<label>Type de production d'eau chaude</label>
<input id="eauChaude" type="text">

<label>Surface du logement</label>
<input id="surface" type="text">

<label>Nombre d'occupants</label>
<input id="occupants" type="number">

<label>Montant mensuel de la facture d'électricité</label>
<input id="electricite" type="text">

<label>Âge / état de l'équipement actuel</label>
<input id="ageEquipement" type="text">

<label>Projet envisagé</label>
<textarea id="projet" placeholder="Décrire le projet du client..."></textarea>

<label>Autres détails</label>
<textarea id="details" placeholder="Informations complémentaires..."></textarea>

<div class="card">
  <strong>Rendez-vous pris par</strong>
  <p>Romaric</p>

  <strong>Date de prise du rendez-vous</strong>
  <p id="datePrise"></p>
</div>

<label>Date du rendez-vous</label>
<input id="rdvDate" type="date">

<label>Heure du rendez-vous</label>
<input id="rdvHeure" type="time">

<label>Durée du rendez-vous</label>
<select id="duree">
  <option value="30">30 minutes</option>
  <option value="45">45 minutes</option>
  <option value="60" selected>1 heure</option>
  <option value="90">1 h 30</option>
  <option value="120">2 heures</option>
</select>

<button class="action" onclick="saveProspect()">
  Enregistrer le prospect
</button>

</div>
</section>

</main>

<script>

const STORAGE_PROSPECTS = "prospect_agenda_prospects";
const STORAGE_APPOINTMENTS = "prospect_agenda_appointments";

let prospects = JSON.parse(
  localStorage.getItem(STORAGE_PROSPECTS) || "[]"
);

let appointments = JSON.parse(
  localStorage.getItem(STORAGE_APPOINTMENTS) || "[]"
);


// -------------------------
// NAVIGATION
// -------------------------

function showTab(tab, button){

  document.querySelectorAll(".section")
    .forEach(x => x.classList.remove("active"));

  document.getElementById(tab)
    .classList.add("active");

  document.querySelectorAll(".tab")
    .forEach(x => x.classList.remove("active"));

  button.classList.add("active");

  if(tab === "prospects") renderProspects();
  if(tab === "agenda") renderAgenda();
  if(tab === "new") updateDatePrise();
}


// -------------------------
// DATE AUTOMATIQUE
// -------------------------

function updateDatePrise(){

  const now = new Date();

  document.getElementById("datePrise").textContent =
    now.toLocaleDateString("fr-FR");

}


// -------------------------
// ENREGISTREMENT
// -------------------------

function saveProspect(){

  const prenom = document.getElementById("prenom").value.trim();
  const nom = document.getElementById("nom").value.trim();

  if(!prenom && !nom){
    alert("Veuillez renseigner le prénom ou le nom.");
    return;
  }

  const now = new Date();

  const prospect = {

    id: Date.now(),

    prenom,
    nom,

    telephone:
      document.getElementById("telephone").value.trim(),

    adresse:
      document.getElementById("adresse").value.trim(),

    chauffage:
      document.getElementById("chauffage").value.trim(),

    gaz:
      document.getElementById("gaz").value.trim(),

    eauChaude:
      document.getElementById("eauChaude").value.trim(),

    surface:
      document.getElementById("surface").value.trim(),

    occupants:
      document.getElementById("occupants").value.trim(),

    electricite:
      document.getElementById("electricite").value.trim(),

    ageEquipement:
      document.getElementById("ageEquipement").value.trim(),

    projet:
      document.getElementById("projet").value.trim(),

    details:
      document.getElementById("details").value.trim(),

    prisPar: "Romaric",

    datePrise:
      now.toLocaleDateString("fr-FR"),

    rdvDate:
      document.getElementById("rdvDate").value,

    rdvHeure:
      document.getElementById("rdvHeure").value,

    duree:
      document.getElementById("duree").value

  };

  prospects.push(prospect);

  localStorage.setItem(
    STORAGE_PROSPECTS,
    JSON.stringify(prospects)
  );


  // Création de l'enregistrement agenda local
  if(prospect.rdvDate && prospect.rdvHeure){

    appointments.push({
      id: prospect.id,
      prospectId: prospect.id,
      nom: `${prenom} ${nom}`.trim(),
      adresse: prospect.adresse,
      date: prospect.rdvDate,
      heure: prospect.rdvHeure,
      duree: prospect.duree,
      telephone: prospect.telephone
    });

    localStorage.setItem(
      STORAGE_APPOINTMENTS,
      JSON.stringify(appointments)
    );

    ouvrirGoogleAgenda(prospect);

  }


  alert("Prospect enregistré.");

  document.querySelectorAll("#new input, #new textarea")
    .forEach(x => x.value = "");

  document.getElementById("duree").value = "60";

  updateDatePrise();
  renderProspects();

  showTab(
    "prospects",
    document.querySelectorAll(".tab")[0]
  );
}


// -------------------------
// GOOGLE AGENDA
// -------------------------

function ouvrirGoogleAgenda(p){

  if(!p.rdvDate || !p.rdvHeure) return;

  const debut =
    new Date(`${p.rdvDate}T${p.rdvHeure}`);

  const fin =
    new Date(
      debut.getTime() +
      Number(p.duree) * 60000
    );

  function formatGoogleDate(d){

    return d.toISOString()
      .replace(/[-:]/g,"")
      .replace(/\.\d{3}/,"");

  }

  const titre =
    `Rendez-vous ${p.prenom} ${p.nom}`.trim();

  const description =
`Prospect pris par : ${p.prisPar}

Téléphone : ${p.telephone}

Chauffage : ${p.chauffage}

Gaz : ${p.gaz}

Eau chaude : ${p.eauChaude}

Surface : ${p.surface}

Occupants : ${p.occupants}

Électricité : ${p.electricite}

Âge équipement : ${p.ageEquipement}

Projet envisagé :
${p.projet}

Autres détails :
${p.details}`;

  const url =
    "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(titre) +
    "&dates=" + formatGoogleDate(debut) +
    "/" + formatGoogleDate(fin) +
    "&details=" + encodeURIComponent(description) +
    "&location=" + encodeURIComponent(p.adresse);

  window.open(url,"_blank");

}


// -------------------------
// AFFICHAGE PROSPECTS
// -------------------------

function renderProspects(){

  const container =
    document.getElementById("prospectList");

  const search =
    document.getElementById("search").value
      .toLowerCase();

  const filtered =
    prospects.filter(p => {

      const text =
        `${p.prenom} ${p.nom} ${p.telephone} ${p.adresse}`
        .toLowerCase();

      return text.includes(search);

    });


  if(filtered.length === 0){

    container.innerHTML =
      `<div class="card">Aucun prospect.</div>`;

    return;

  }


  container.innerHTML =
    filtered.map(p => `

      <div class="card">

        <h3>
          ${escapeHtml(
            `${p.prenom} ${p.nom}`.trim()
          )}
        </h3>

        <p>
          📞 ${escapeHtml(p.telephone || "-")}
        </p>

        <p>
          📍 ${escapeHtml(p.adresse || "-")}
        </p>

        <p>
          👤 Rendez-vous pris par :
          <strong>${escapeHtml(p.prisPar)}</strong>
        </p>

        <p>
          📅 Pris le :
          ${escapeHtml(p.datePrise)}
        </p>

        ${
          p.projet
          ? `<p><strong>Projet :</strong>
             ${escapeHtml(p.projet)}</p>`
          : ""
        }

        ${
          p.details
          ? `<p><strong>Détails :</strong>
             ${escapeHtml(p.details)}</p>`
          : ""
        }

        <div class="row">

          <button class="action"
            onclick="appeler('${encodeURIComponent(p.telephone)}')">
            Appeler
          </button>

          <button class="action"
            onclick="itineraire('${encodeURIComponent(p.adresse)}')">
            Itinéraire
          </button>

        </div>

        ${
          p.rdvDate
          ?
          `<button class="action secondary"
             onclick="ouvrirGoogleAgendaDepuisProspect(${p.id})">
             Google Agenda
           </button>`
          :
          ""
        }

        <button class="action danger"
          onclick="deleteProspect(${p.id})">
          Supprimer
        </button>

      </div>

    `).join("");

}


// -------------------------
// AGENDA
// -------------------------

function renderAgenda(){

  const container =
    document.getElementById("agendaList");

  const sorted =
    [...appointments].sort((a,b) =>
      (`${a.date} ${a.heure}`)
      .localeCompare(`${b.date} ${b.heure}`)
    );


  if(sorted.length === 0){

    container.innerHTML =
      `<div class="card">Aucun rendez-vous.</div>`;

    return;

  }


  container.innerHTML =
    sorted.map(a => `

      <div class="card">

        <h3>${escapeHtml(a.nom)}</h3>

        <p>
          📅 ${formatDate(a.date)}
          à ${escapeHtml(a.heure)}
        </p>

        <p>
          📍 ${escapeHtml(a.adresse || "-")}
        </p>

        <button class="action"
          onclick="ouvrirGoogleAgendaDepuisAppointment(${a.id})">
          Ouvrir dans Google Agenda
        </button>

      </div>

    `).join("");

}


// -------------------------
// ACTIONS
// -------------------------

function appeler(phone){

  if(!phone){
    alert("Aucun numéro de téléphone.");
    return;
  }

  window.location.href =
    "tel:" + decodeURIComponent(phone);

}


function itineraire(address){

  if(!address){
    alert("Aucune adresse.");
    return;
  }

  window.open(
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(address),
    "_blank"
  );

}


function ouvrirGoogleAgendaDepuisProspect(id){

  const p =
    prospects.find(x => x.id === id);

  if(p) ouvrirGoogleAgenda(p);

}


function ouvrirGoogleAgendaDepuisAppointment(id){

  const a =
    appointments.find(x => x.id === id);

  if(!a) return;

  const p =
    prospects.find(x => x.id === a.prospectId);

  if(p){

    ouvrirGoogleAgenda(p);

  }else{

    const temp = {
      prenom: a.nom,
      nom: "",
      adresse: a.adresse,
      telephone: a.telephone,
      rdvDate: a.date,
      rdvHeure: a.heure,
      duree: a.duree,
      prisPar: "Romaric",
      projet: "",
      details: ""
    };

    ouvrirGoogleAgenda(temp);

  }

}


function deleteProspect(id){

  if(!confirm("Supprimer ce prospect ?")) return;

  prospects =
    prospects.filter(p => p.id !== id);

  appointments =
    appointments.filter(a => a.prospectId !== id);

  localStorage.setItem(
    STORAGE_PROSPECTS,
    JSON.stringify(prospects)
  );

  localStorage.setItem(
    STORAGE_APPOINTMENTS,
    JSON.stringify(appointments)
  );

  renderProspects();

}


// -------------------------
// UTILITAIRES
// -------------------------

function formatDate(date){

  if(!date) return "-";

  const parts = date.split("-");

  if(parts.length !== 3) return date;

  return `${parts[2]}/${parts[1]}/${parts[0]}`;

}


function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// Initialisation

updateDatePrise();
renderProspects();

</script>

</body>
</html>
