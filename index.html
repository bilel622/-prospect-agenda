<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Prospect Agenda</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      padding-top: 55px;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 5px 0 0;
      opacity: .7;
    }

    .content {
      padding: 16px;
      padding-bottom: 90px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      margin-bottom: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    label {
      font-weight: 600;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 13px 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
      margin-top: 8px;
    }

    .danger {
      background: #fee2e2;
      color: #991b1b;
      margin-top: 8px;
    }

    .prospect-name {
      font-size: 18px;
      font-weight: 700;
    }

    .small {
      color: #6b7280;
      font-size: 14px;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .actions button {
      flex: 1;
      font-size: 14px;
      padding: 11px 5px;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 40px 10px;
    }

    .tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      z-index: 100;
    }

    .tabs button {
      flex: 1;
      background: white;
      border-radius: 0;
      color: #6b7280;
      font-size: 13px;
    }

    .tabs button.active {
      color: #111827;
      font-weight: 800;
    }

    .hidden {
      display: none;
    }

    h2 {
      margin-top: 5px;
    }
  </style>
</head>

<body>

<header>
  <h1>Prospect Agenda</h1>
  <p>Gestion de vos prospects</p>
</header>

<div class="content">

  <!-- PROSPECTS -->
  <section id="prospects">
    <h2>Mes prospects</h2>

    <input
      id="search"
      type="search"
      placeholder="Rechercher un prospect..."
      oninput="displayProspects()"
    >

    <div id="prospectList"></div>
  </section>


  <!-- NOUVEAU -->
  <section id="new" class="hidden">
    <h2>Nouveau prospect</h2>

    <div class="card">

      <label>Prénom</label>
      <input id="firstName" type="text" placeholder="Prénom">

      <label>Nom</label>
      <input id="lastName" type="text" placeholder="Nom">

      <label>Téléphone</label>
      <input id="phone" type="tel" placeholder="06...">

      <label>Adresse</label>
      <input id="address" type="text" placeholder="Adresse complète">

      <label>Comment chauffez-vous votre logement ?</label>
      <select id="heating">
        <option value="">Sélectionner</option>
        <option>Gaz</option>
        <option>Fioul</option>
        <option>Électricité</option>
        <option>Pompe à chaleur</option>
        <option>Bois</option>
        <option>Poêle à granulés</option>
        <option>Autre</option>
      </select>

      <label>Facture gaz mensuelle</label>
      <input id="gasBill" type="number" placeholder="€ / mois">

      <label>Production d'eau chaude</label>
      <select id="hotWater">
        <option value="">Sélectionner</option>
        <option>Ballon électrique</option>
        <option>Gaz</option>
        <option>Pompe à chaleur</option>
        <option>Solaire</option>
        <option>Autre</option>
      </select>

      <label>Surface du logement</label>
      <input id="surface" type="number" placeholder="m²">

      <label>Nombre d'occupants</label>
      <input id="occupants" type="number" placeholder="Nombre de personnes">

      <label>Facture électrique mensuelle</label>
      <input id="electricBill" type="number" placeholder="€ / mois">

      <label>Âge / état de l'équipement actuel</label>
      <textarea
        id="equipment"
        rows="3"
        placeholder="Ex : chaudière de 15 ans, entretien régulier..."
      ></textarea>

      <button class="primary" onclick="saveProspect()">
        Enregistrer le prospect
      </button>

    </div>
  </section>


  <!-- AGENDA -->
  <section id="agenda" class="hidden">
    <h2>Agenda</h2>

    <div id="appointmentList"></div>
  </section>

</div>


<!-- MENU -->
<nav class="tabs">
  <button id="tabProspects" class="active" onclick="showTab('prospects')">
    👥<br>Prospects
  </button>

  <button id="tabAgenda" onclick="showTab('agenda')">
    📅<br>Agenda
  </button>

  <button id="tabNew" onclick="showTab('new')">
    ➕<br>Nouveau
  </button>
</nav>


<script>

let prospects = JSON.parse(
  localStorage.getItem("prospects") || "[]"
);

let appointments = JSON.parse(
  localStorage.getItem("appointments") || "[]"
);


// CHANGEMENT D'ONGLET
function showTab(tab) {

  document.getElementById("prospects").classList.add("hidden");
  document.getElementById("agenda").classList.add("hidden");
  document.getElementById("new").classList.add("hidden");

  document.getElementById("tabProspects").classList.remove("active");
  document.getElementById("tabAgenda").classList.remove("active");
  document.getElementById("tabNew").classList.remove("active");

  document.getElementById(tab).classList.remove("hidden");

  document.getElementById(
    "tab" + tab.charAt(0).toUpperCase() + tab.slice(1)
  ).classList.add("active");

  if (tab === "prospects") {
    displayProspects();
  }

  if (tab === "agenda") {
    displayAppointments();
  }
}


// ENREGISTRER PROSPECT
function saveProspect() {

  const prospect = {

    id: Date.now(),

    firstName: document.getElementById("firstName").value.trim(),

    lastName: document.getElementById("lastName").value.trim(),

    phone: document.getElementById("phone").value.trim(),

    address: document.getElementById("address").value.trim(),

    heating: document.getElementById("heating").value,

    gasBill: document.getElementById("gasBill").value,

    hotWater: document.getElementById("hotWater").value,

    surface: document.getElementById("surface").value,

    occupants: document.getElementById("occupants").value,

    electricBill: document.getElementById("electricBill").value,

    equipment: document.getElementById("equipment").value.trim()

  };


  if (!prospect.firstName && !prospect.lastName) {

    alert("Veuillez au minimum renseigner le nom du prospect.");

    return;
  }


  prospects.push(prospect);

  localStorage.setItem(
    "prospects",
    JSON.stringify(prospects)
  );


  alert("Prospect enregistré ✅");


  clearForm();

  showTab("prospects");
}


// VIDER FORMULAIRE
function clearForm() {

  document.querySelectorAll("#new input, #new textarea").forEach(
    element => element.value = ""
  );

  document.querySelectorAll("#new select").forEach(
    element => element.selectedIndex = 0
  );
}


// AFFICHER PROSPECTS
function displayProspects() {

  const container =
    document.getElementById("prospectList");

  const search =
    document.getElementById("search").value.toLowerCase();


  const filtered = prospects.filter(p => {

    const text =
      `${p.firstName} ${p.lastName} ${p.phone} ${p.address}`
      .toLowerCase();

    return text.includes(search);

  });


  if (filtered.length === 0) {

    container.innerHTML =
      `<div class="empty">
        Aucun prospect enregistré.
      </div>`;

    return;
  }


  container.innerHTML = filtered.map(p => `

    <div class="card">

      <div class="prospect-name">
        ${escapeHtml(p.firstName)} ${escapeHtml(p.lastName)}
      </div>

      <div class="small">
        📞 ${escapeHtml(p.phone || "Téléphone non renseigné")}
      </div>

      <div class="small">
        📍 ${escapeHtml(p.address || "Adresse non renseignée")}
      </div>

      <div class="small">
        🔥 ${escapeHtml(p.heating || "Chauffage non renseigné")}
      </div>

      <div class="actions">

        <button
          class="secondary"
          onclick="callProspect('${escapeAttr(p.phone)}')">
          📞 Appeler
        </button>

        <button
          class="secondary"
          onclick="openMaps('${escapeAttr(p.address)}')">
          📍 Itinéraire
        </button>

      </div>

      <div class="actions">

        <button
          class="secondary"
          onclick="createAppointment(${p.id})">
          📅 RDV
        </button>

        <button
          class="danger"
          onclick="deleteProspect(${p.id})">
          🗑 Supprimer
        </button>

      </div>

    </div>

  `).join("");
}


// APPELER
function callProspect(phone) {

  if (!phone) {

    alert("Aucun numéro enregistré.");

    return;
  }

  window.location.href =
    "tel:" + phone;
}


// GOOGLE MAPS
function openMaps(address) {

  if (!address) {

    alert("Aucune adresse enregistrée.");

    return;
  }

  window.open(
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(address),
    "_blank"
  );
}


// SUPPRIMER
function deleteProspect(id) {

  if (!confirm("Supprimer ce prospect ?")) {
    return;
  }

  prospects =
    prospects.filter(p => p.id !== id);

  localStorage.setItem(
    "prospects",
    JSON.stringify(prospects)
  );

  displayProspects();
}


// CRÉER RDV
function createAppointment(id) {

  const prospect =
    prospects.find(p => p.id === id);

  if (!prospect) return;


  const date =
    prompt("Date du rendez-vous (AAAA-MM-JJ) :");

  if (!date) return;


  const time =
    prompt("Heure du rendez-vous (HH:MM) :");

  if (!time) return;


  const appointment = {

    id: Date.now(),

    prospectId: id,

    name:
      `${prospect.firstName} ${prospect.lastName}`,

    address:
      prospect.address,

    date:
      date,

    time:
      time

  };


  appointments.push(appointment);


  localStorage.setItem(
    "appointments",
    JSON.stringify(appointments)
  );


  // Ouverture de Google Calendar
  const start =
    date.replaceAll("-", "") +
    "T" +
    time.replace(":", "") +
    "00";

  const endDate =
    new Date(
      `${date}T${time}`
    );

  endDate.setMinutes(
    endDate.getMinutes() + 60
  );

  const end =
    endDate.toISOString()
      .replace(/[-:]/g, "")
      .split(".")[0];


  const calendarUrl =
    "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" +
    encodeURIComponent(
      "RDV - " +
      prospect.firstName +
      " " +
      prospect.lastName
    ) +
    "&dates=" +
    start +
    "/" +
    end +
    "&location=" +
    encodeURIComponent(prospect.address || "") +
    "&details=" +
    encodeURIComponent(
      "Prospect chauffage\n" +
      "Téléphone : " +
      prospect.phone
    );


  window.open(calendarUrl, "_blank");

  displayAppointments();
}


// AFFICHER AGENDA
function displayAppointments() {

  const container =
    document.getElementById("appointmentList");


  if (appointments.length === 0) {

    container.innerHTML =
      `<div class="empty">
        Aucun rendez-vous enregistré.
      </div>`;

    return;
  }


  const sorted =
    [...appointments].sort(
      (a, b) =>
        (a.date + a.time)
        .localeCompare(b.date + b.time)
    );


  container.innerHTML =
    sorted.map(a => `

      <div class="card">

        <div class="prospect-name">
          📅 ${escapeHtml(a.name)}
        </div>

        <div class="small">
          ${escapeHtml(a.date)} à ${escapeHtml(a.time)}
        </div>

        <div class="small">
          📍 ${escapeHtml(a.address || "")}
        </div>

      </div>

    `).join("");
}


// PROTECTION AFFICHAGE
function escapeHtml(value) {

  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function escapeAttr(value) {

  return String(value || "")
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'");
}


// AFFICHAGE INITIAL
displayProspects();

</script>

</body>
</html>
