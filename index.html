<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Prospect Agenda</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background:#f4f7fb;
  color:#172033;
}
.header{
  background:linear-gradient(135deg,#071b45,#124b9b);
  color:white;
  padding:28px 20px 24px;
  border-radius:0 0 28px 28px;
  box-shadow:0 8px 25px rgba(7,27,69,.18);
}
.header h1{margin:0;font-size:26px}
.header p{margin:6px 0 0;opacity:.8;font-size:14px}

.container{
  padding:18px 16px 100px;
  max-width:700px;
  margin:auto;
}

.page{display:none}
.page.active{display:block}

.card{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 5px 18px rgba(20,45,80,.07);
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:18px;
}
.stat{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 5px 18px rgba(20,45,80,.07);
}
.stat strong{
  display:block;
  font-size:26px;
  color:#124b9b;
}
.stat span{font-size:13px;color:#667085}

h2{font-size:21px;margin:8px 0 16px}
h3{margin:0 0 8px}

label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:#4b5563;
  margin:14px 0 6px;
}

input,textarea{
  width:100%;
  border:1px solid #dce3ed;
  background:#f9fbfd;
  border-radius:13px;
  padding:13px;
  font-size:15px;
  outline:none;
}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{
  border-color:#2167c7;
  background:white;
}

.btn{
  border:0;
  border-radius:13px;
  padding:13px 15px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}
.btn-primary{
  background:#124b9b;
  color:white;
}
.btn-secondary{
  background:#edf3fb;
  color:#124b9b;
}
.btn-danger{
  background:#fff0f0;
  color:#c62828;
}
.btn-green{
  background:#eaf8f0;
  color:#167344;
}

.actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:14px;
}

.full{width:100%;margin-top:14px}

.prospect{
  background:white;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 5px 18px rgba(20,45,80,.07);
}
.prospect-name{
  font-size:18px;
  font-weight:800;
}
.prospect-info{
  color:#667085;
  font-size:13px;
  margin-top:5px;
}

.badge{
  display:inline-block;
  margin-top:8px;
  padding:6px 9px;
  border-radius:20px;
  background:#edf3fb;
  color:#124b9b;
  font-size:12px;
  font-weight:700;
}

.search{
  margin-bottom:14px;
}

.empty{
  text-align:center;
  color:#7a8495;
  padding:30px 10px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(15px);
  border-top:1px solid #e5eaf1;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:100;
}
.nav-btn{
  border:0;
  background:none;
  color:#7a8495;
  font-size:11px;
  font-weight:600;
}
.nav-btn span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}
.nav-btn.active{color:#124b9b}

.back{
  display:inline-block;
  margin-bottom:12px;
  color:#124b9b;
  font-weight:700;
  cursor:pointer;
}

.small{
  font-size:12px;
  color:#7a8495;
}

.separator{
  height:1px;
  background:#edf0f5;
  margin:16px 0;
}
</style>
</head>

<body>

<header class="header">
  <h1>Prospect Agenda</h1>
  <p>Votre CRM commercial</p>
</header>

<div class="container">

<!-- ACCUEIL -->
<section id="homePage" class="page active">
  <h2>Tableau de bord</h2>

  <div class="stats">
    <div class="stat">
      <strong id="statProspects">0</strong>
      <span>Prospects</span>
    </div>

    <div class="stat">
      <strong id="statRdv">0</strong>
      <span>Rendez-vous</span>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <h3>Actions rapides</h3>

    <button class="btn btn-primary full" onclick="showPage('newPage')">
      ➕ Nouveau prospect
    </button>

    <button class="btn btn-secondary full" onclick="showPage('prospectsPage')">
      👥 Voir mes prospects
    </button>

    <button class="btn btn-secondary full" onclick="showPage('agendaPage')">
      📅 Voir mon agenda
    </button>
  </div>
</section>


<!-- PROSPECTS -->
<section id="prospectsPage" class="page">
  <h2>Mes prospects</h2>

  <input
    id="searchInput"
    class="search"
    type="search"
    placeholder="🔎 Rechercher un nom, téléphone ou adresse..."
    oninput="displayProspects()"
  >

  <div id="prospectsList"></div>
</section>


<!-- FICHE PROSPECT -->
<section id="detailPage" class="page">
  <div class="back" onclick="showPage('prospectsPage')">‹ Retour aux prospects</div>

  <div id="detailContent"></div>
</section>


<!-- NOUVEAU / MODIFICATION -->
<section id="newPage" class="page">
  <h2 id="formTitle">Nouveau prospect</h2>

  <form id="prospectForm">

    <input type="hidden" id="editId">

    <label>Nom</label>
    <input id="name" required>

    <label>Téléphone</label>
    <input id="phone" type="tel" required>

    <label>Adresse</label>
    <input id="address" required>

    <label>Comment chauffez-vous votre logement ?</label>
    <input id="heating">

    <label>Facture gaz mensuelle</label>
    <input id="gasBill" type="text" placeholder="Ex : 120 €">

    <label>Type de production d’eau chaude</label>
    <input id="hotWater">

    <label>Surface du logement</label>
    <input id="surface" type="text" placeholder="Ex : 100 m²">

    <label>Nombre d’occupants</label>
    <input id="occupants" type="number">

    <label>Facture électrique mensuelle</label>
    <input id="electricBill" type="text" placeholder="Ex : 150 €">

    <label>Âge / état de l’équipement actuel</label>
    <input id="equipment">

    <label>Projet envisagé</label>
    <input id="project">

    <label>Autres détails</label>
    <textarea id="details"></textarea>

    <button class="btn btn-primary full" type="submit">
      💾 Enregistrer le prospect
    </button>

    <button
      type="button"
      id="cancelEdit"
      class="btn btn-secondary full"
      onclick="showPage('prospectsPage')"
      style="display:none"
    >
      Annuler
    </button>

  </form>
</section>


<!-- AGENDA -->
<section id="agendaPage" class="page">
  <h2>Mon agenda</h2>
  <div id="agendaList"></div>
</section>

</div>


<!-- NAVIGATION -->
<nav class="bottom-nav">

  <button class="nav-btn active" id="navHome" onclick="showPage('homePage')">
    <span>🏠</span>
    Accueil
  </button>

  <button class="nav-btn" id="navProspects" onclick="showPage('prospectsPage')">
    <span>👥</span>
    Prospects
  </button>

  <button class="nav-btn" id="navAgenda" onclick="showPage('agendaPage')">
    <span>📅</span>
    Agenda
  </button>

  <button class="nav-btn" id="navNew" onclick="prepareNew()">
    <span>➕</span>
    Nouveau
  </button>

</nav>


<script>

const STORAGE_PROSPECTS = "prospects";
const STORAGE_APPOINTMENTS = "appointments";

let prospects = JSON.parse(localStorage.getItem(STORAGE_PROSPECTS) || "[]");
let appointments = JSON.parse(localStorage.getItem(STORAGE_APPOINTMENTS) || "[]");

let currentDetailId = null;


/* =========================
   OUTILS
========================= */

function saveData(){
  localStorage.setItem(STORAGE_PROSPECTS, JSON.stringify(prospects));
  localStorage.setItem(STORAGE_APPOINTMENTS, JSON.stringify(appointments));
  updateStats();
}

function updateStats(){
  document.getElementById("statProspects").textContent = prospects.length;
  document.getElementById("statRdv").textContent = appointments.length;
}

function formatDate(date){
  if(!date) return "";
  const d = new Date(date);
  if(isNaN(d)) return date;

  return d.toLocaleDateString("fr-FR");
}

function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}


/* =========================
   NAVIGATION
========================= */

function showPage(pageId){

  document.querySelectorAll(".page").forEach(p=>{
    p.classList.remove("active");
  });

  document.getElementById(pageId).classList.add("active");

  document.querySelectorAll(".nav-btn").forEach(b=>{
    b.classList.remove("active");
  });

  if(pageId === "homePage")
    document.getElementById("navHome").classList.add("active");

  if(pageId === "prospectsPage")
    document.getElementById("navProspects").classList.add("active");

  if(pageId === "agendaPage")
    document.getElementById("navAgenda").classList.add("active");

  if(pageId === "newPage")
    document.getElementById("navNew").classList.add("active");

  window.scrollTo(0,0);

  if(pageId === "prospectsPage") displayProspects();
  if(pageId === "agendaPage") displayAgenda();
  if(pageId === "homePage") updateStats();
}


/* =========================
   NOUVEAU PROSPECT
========================= */

function prepareNew(){

  document.getElementById("prospectForm").reset();
  document.getElementById("editId").value = "";
  document.getElementById("formTitle").textContent = "Nouveau prospect";
  document.getElementById("cancelEdit").style.display = "none";

  showPage("newPage");
}


/* =========================
   AFFICHAGE PROSPECTS
========================= */

function displayProspects(){

  const list = document.getElementById("prospectsList");
  const search = (document.getElementById("searchInput")?.value || "").toLowerCase();

  const filtered = prospects.filter(p =>
    (p.name || "").toLowerCase().includes(search) ||
    (p.phone || "").toLowerCase().includes(search) ||
    (p.address || "").toLowerCase().includes(search)
  );

  if(filtered.length === 0){
    list.innerHTML = `
      <div class="card empty">
        Aucun prospect trouvé.
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map(p => `
    <div class="prospect">

      <div class="prospect-name">${escapeHTML(p.name)}</div>

      <div class="prospect-info">📞 ${escapeHTML(p.phone)}</div>
      <div class="prospect-info">📍 ${escapeHTML(p.address)}</div>

      ${p.project ? `<span class="badge">${escapeHTML(p.project)}</span>` : ""}

      <div class="actions">

        <button class="btn btn-primary" onclick="callClient('${p.id}')">
          📞 Appeler
        </button>

        <button class="btn btn-secondary" onclick="openMaps('${p.id}')">
          📍 Itinéraire
        </button>

        <button class="btn btn-secondary" onclick="viewProspect('${p.id}')">
          👁️ Voir
        </button>

        <button class="btn btn-secondary" onclick="editProspect('${p.id}')">
          ✏️ Modifier
        </button>

      </div>

    </div>
  `).join("");
}


/* =========================
   FICHE PROSPECT
========================= */

function viewProspect(id){

  const p = prospects.find(x => x.id === id);
  if(!p) return;

  currentDetailId = id;

  document.getElementById("detailContent").innerHTML = `

    <div class="card">

      <h2>${escapeHTML(p.name)}</h2>

      <div class="prospect-info">📞 ${escapeHTML(p.phone)}</div>
      <div class="prospect-info">📍 ${escapeHTML(p.address)}</div>

      <div class="separator"></div>

      <h3>Informations</h3>

      <p><strong>Chauffage :</strong> ${escapeHTML(p.heating || "-")}</p>

      <p><strong>Facture gaz :</strong> ${escapeHTML(p.gasBill || "-")}</p>

      <p><strong>Eau chaude :</strong> ${escapeHTML(p.hotWater || "-")}</p>

      <p><strong>Surface :</strong> ${escapeHTML(p.surface || "-")}</p>

      <p><strong>Occupants :</strong> ${escapeHTML(String(p.occupants || "-"))}</p>

      <p><strong>Facture électrique :</strong> ${escapeHTML(p.electricBill || "-")}</p>

      <p><strong>Équipement :</strong> ${escapeHTML(p.equipment || "-")}</p>

      <p><strong>Projet :</strong> ${escapeHTML(p.project || "-")}</p>

      <p><strong>Autres détails :</strong><br>
      ${escapeHTML(p.details || "-")}</p>

      <div class="separator"></div>

      <div class="small">
        Prospect créé le ${formatDate(p.createdAt)} par Romaric
      </div>

    </div>

    <div class="card">

      <h3>Actions</h3>

      <div class="actions">

        <button class="btn btn-primary" onclick="callClient('${p.id}')">
          📞 Appeler
        </button>

        <button class="btn btn-secondary" onclick="openMaps('${p.id}')">
          📍 Itinéraire
        </button>

        <button class="btn btn-green" onclick="createAppointment('${p.id}')">
          📅 Nouveau RDV
        </button>

        <button class="btn btn-secondary" onclick="editProspect('${p.id}')">
          ✏️ Modifier
        </button>

        <button class="btn btn-danger" onclick="deleteProspect('${p.id}')">
          🗑️ Supprimer
        </button>

      </div>

    </div>
  `;

  showPage("detailPage");
}


/* =========================
   APPELER
========================= */

function callClient(id){

  const p = prospects.find(x => x.id === id);
  if(!p || !p.phone) return;

  window.location.href = "tel:" + p.phone.replace(/\s/g,"");
}


/* =========================
   ITINÉRAIRE
========================= */

function openMaps(id){

  const p = prospects.find(x => x.id === id);
  if(!p || !p.address) return;

  const url =
    "https://www.google.com/maps/dir/?api=1&destination=" +
    encodeURIComponent(p.address);

  window.open(url,"_blank");
}


/* =========================
   MODIFIER
========================= */

function editProspect(id){

  const p = prospects.find(x => x.id === id);
  if(!p) return;

  document.getElementById("editId").value = p.id;

  document.getElementById("name").value = p.name || "";
  document.getElementById("phone").value = p.phone || "";
  document.getElementById("address").value = p.address || "";
  document.getElementById("heating").value = p.heating || "";
  document.getElementById("gasBill").value = p.gasBill || "";
  document.getElementById("hotWater").value = p.hotWater || "";
  document.getElementById("surface").value = p.surface || "";
  document.getElementById("occupants").value = p.occupants || "";
  document.getElementById("electricBill").value = p.electricBill || "";
  document.getElementById("equipment").value = p.equipment || "";
  document.getElementById("project").value = p.project || "";
  document.getElementById("details").value = p.details || "";

  document.getElementById("formTitle").textContent = "Modifier le prospect";
  document.getElementById("cancelEdit").style.display = "block";

  showPage("newPage");
}


/* =========================
   SUPPRIMER
========================= */

function deleteProspect(id){

  const p = prospects.find(x => x.id === id);
  if(!p) return;

  const confirmation = confirm(
    "Supprimer définitivement le prospect " + p.name + " ?"
  );

  if(!confirmation) return;

  prospects = prospects.filter(x => x.id !== id);

  appointments = appointments.filter(x => x.prospectId !== id);

  saveData();

  showPage("prospectsPage");
}


/* =========================
   ENREGISTREMENT
========================= */

document.getElementById("prospectForm").addEventListener("submit", function(e){

  e.preventDefault();

  const editId = document.getElementById("editId").value;

  const data = {

    name: document.getElementById("name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    address: document.getElementById("address").value.trim(),
    heating: document.getElementById("heating").value.trim(),
    gasBill: document.getElementById("gasBill").value.trim(),
    hotWater: document.getElementById("hotWater").value.trim(),
    surface: document.getElementById("surface").value.trim(),
    occupants: document.getElementById("occupants").value,
    electricBill: document.getElementById("electricBill").value.trim(),
    equipment: document.getElementById("equipment").value.trim(),
    project: document.getElementById("project").value.trim(),
    details: document.getElementById("details").value.trim()
  };


  if(editId){

    const index = prospects.findIndex(x => x.id === editId);

    if(index !== -1){

      prospects[index] = {
        ...prospects[index],
        ...data,
        updatedAt: new Date().toISOString()
      };

    }

  }else{

    prospects.push({

      id: Date.now().toString(),

      ...data,

      createdAt: new Date().toISOString(),

      createdBy: "Romaric"

    });

  }


  saveData();

  alert(
    editId
    ? "Prospect modifié avec succès."
    : "Prospect enregistré avec succès."
  );

  prepareNew();

  showPage("prospectsPage");

});


/* =========================
   GOOGLE CALENDAR
========================= */

function createAppointment(id){

  const p = prospects.find(x => x.id === id);
  if(!p) return;

  const date = prompt(
    "Date du rendez-vous (JJ/MM/AAAA)",
    new Date().toLocaleDateString("fr-FR")
  );

  if(!date) return;

  const time = prompt(
    "Heure du rendez-vous (HH:MM)",
    "10:00"
  );

  if(!time) return;

  const parts = date.split("/");

  if(parts.length !== 3){
    alert("Format de date incorrect.");
    return;
  }

  const day = Number(parts[0]);
  const month = Number(parts[1]) - 1;
  const year = Number(parts[2]);

  const timeParts = time.split(":");

  const hour = Number(timeParts[0]);
  const minute = Number(timeParts[1] || 0);

  const start = new Date(
    year,
    month,
    day,
    hour,
    minute
  );

  const end = new Date(start.getTime() + 30 * 60 * 1000);

  function calendarDate(d){

    return (
      d.getFullYear() +
      String(d.getMonth()+1).padStart(2,"0") +
      String(d.getDate()).padStart(2,"0") +
      "T" +
      String(d.getHours()).padStart(2,"0") +
      String(d.getMinutes()).padStart(2,"0") +
      "00"
    );

  }

  const description =

    "RDV pris par Romaric\n" +
    "Date de prise du RDV : " +
    new Date().toLocaleDateString("fr-FR") +
    "\n\n" +

    "Téléphone : " + p.phone +
    "\nChauffage : " + (p.heating || "-") +
    "\nFacture gaz : " + (p.gasBill || "-") +
    "\nEau chaude : " + (p.hotWater || "-") +
    "\nSurface : " + (p.surface || "-") +
    "\nOccupants : " + (p.occupants || "-") +
    "\nFacture électrique : " + (p.electricBill || "-") +
    "\nÉquipement : " + (p.equipment || "-") +
    "\nProjet : " + (p.project || "-") +
    "\nAutres détails : " + (p.details || "-");


  const url =
    "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent("RDV - " + p.name) +
    "&dates=" + calendarDate(start) + "/" + calendarDate(end) +
    "&location=" + encodeURIComponent(p.address) +
    "&details=" + encodeURIComponent(description);


  appointments.push({

    id: Date.now().toString(),

    prospectId: p.id,

    name: p.name,

    date: start.toISOString(),

    duration: 30,

    createdAt: new Date().toISOString(),

    createdBy: "Romaric"

  });

  saveData();

  window.open(url,"_blank");

  alert(
    "Le rendez-vous est enregistré dans l'application.\n\n" +
    "Google Agenda va s'ouvrir avec toutes les informations préremplies."
  );

}


/* =========================
   AGENDA
========================= */

function displayAgenda(){

  const list = document.getElementById("agendaList");

  if(appointments.length === 0){

    list.innerHTML = `
      <div class="card empty">
        Aucun rendez-vous enregistré.
      </div>
    `;

    return;
  }

  const sorted = [...appointments].sort(
    (a,b) => new Date(a.date) - new Date(b.date)
  );


  list.innerHTML = sorted.map(a => {

    const p = prospects.find(x => x.id === a.prospectId);

    return `

      <div class="card">

        <h3>📅 RDV - ${escapeHTML(a.name)}</h3>

        <p>
          <strong>${new Date(a.date).toLocaleDateString("fr-FR")}</strong>
          à
          <strong>${new Date(a.date).toLocaleTimeString("fr-FR",{
            hour:"2-digit",
            minute:"2-digit"
          })}</strong>
        </p>

        <div class="small">
          Durée : 30 minutes
        </div>

        ${
          p
          ? `
            <div class="actions">

              <button class="btn btn-primary"
                onclick="callClient('${p.id}')">
                📞 Appeler
              </button>

              <button class="btn btn-secondary"
                onclick="openMaps('${p.id}')">
                📍 Itinéraire
              </button>

            </div>
          `
          : ""
        }

      </div>

    `;

  }).join("");

}


/* =========================
   RELANCES
========================= */

function addReminder(id){

  const p = prospects.find(x => x.id === id);
  if(!p) return;

  const date = prompt(
    "Date de relance (JJ/MM/AAAA)",
    new Date().toLocaleDateString("fr-FR")
  );

  if(!date) return;

  const parts = date.split("/");

  if(parts.length !== 3){
    alert("Format incorrect.");
    return;
  }

  const day = Number(parts[0]);
  const month = Number(parts[1]) - 1;
  const year = Number(parts[2]);

  const reminderDate = new Date(year,month,day,9,0,0);

  const title = "Relance prospect - " + p.name;

  const url =
    "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(title) +
    "&dates=" +
    encodeURIComponent(
      reminderDate.getFullYear() +
      String(reminderDate.getMonth()+1).padStart(2,"0") +
      String(reminderDate.getDate()).padStart(2,"0") +
      "T090000/" +
      reminderDate.getFullYear() +
      String(reminderDate.getMonth()+1).padStart(2,"0") +
      String(reminderDate.getDate()).padStart(2,"0") +
      "T093000"
    ) +
    "&location=" + encodeURIComponent(p.address) +
    "&details=" + encodeURIComponent(
      "Relance prospect par Romaric\n" +
      "Téléphone : " + p.phone
    );

  window.open(url,"_blank");

}


/* =========================
   ÉCHAPPEMENT HTML
========================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   AJOUT RELANCE DANS FICHE
========================= */

const oldViewProspect = viewProspect;

viewProspect = function(id){

  oldViewProspect(id);

  setTimeout(()=>{

    const card = document.querySelector("#detailContent .card:nth-child(2)");

    if(card){

      const buttons = card.querySelector(".actions");

      if(buttons){

        const reminderButton = document.createElement("button");

        reminderButton.className = "btn btn-secondary";

        reminderButton.textContent = "🔔 Relance";

        reminderButton.onclick = function(){
          addReminder(id);
        };

        buttons.appendChild(reminderButton);

      }

    }

  },50);

};


/* =========================
   INITIALISATION
========================= */

updateStats();
displayProspects();

</script>
